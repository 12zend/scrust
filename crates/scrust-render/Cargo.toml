[package]
name = "scrust-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU compositor and collision detection for scrust"

[dependencies]
scrust-runtime.workspace = true
scrust-value.workspace = true
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
libm.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images", "system-fonts", "memmap-fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = "0.3"

[features]
# Kept for compatibility: fonts are always embedded now.
embedded-font = []
