[package]
name = "scrust-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Window / web host for programs generated by scrust"

[dependencies]
scrust-runtime.workspace = true
scrust-render.workspace = true
scrust-value.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
softbuffer = "0.4"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
embedded-font = ["scrust-render/embedded-font"]
